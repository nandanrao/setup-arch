# Lid close on battery should reach hibernation, not stop at suspend.
# suspend-then-hibernate suspends first, then hibernates after
# HibernateDelaySec (see sleep.conf.d/10-hibernate.conf).
#
# This only works if swap is large enough -- systemd checks
#   Active(anon) <= (SwapTotal - SwapUsed) * 0.98
# on the single swap area matching /sys/power/resume. If it fails, logind
# silently downgrades to plain suspend and logs
#   "Requested suspend-then-hibernate operation is not supported"
# See initial-crypted-swap.sh for sizing.
#
# On external power, or with an external display attached, closing the lid
# must NOT sleep: long-running work (claude remote control, builds) keeps
# going in clamshell mode. logind picks the handler in this order:
#   docked (external display connected+enabled) -> HandleLidSwitchDocked
#   on AC                                        -> HandleLidSwitchExternalPower
#   otherwise                                    -> HandleLidSwitch
# and RE-EVALUATES on every drm change. So when swayidle powers the external
# monitor off after 50 min, the display count drops to 0 and logind falls
# through to the next rule. With ExternalPower=ignore that fall-through is
# harmless on AC; on battery it still suspends, which is the intent.
#
# IdleAction never fires under sway: graphical sessions are idle only if the
# compositor calls SetIdleHint, and sway does not. Kept for non-sway logins.
[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
IdleAction=suspend-then-hibernate
IdleActionSec=20min
