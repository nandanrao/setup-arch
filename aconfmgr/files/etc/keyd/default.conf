# keyd config -- Lenovo Go Wireless Split only.
#
# The "intelligence"/Copilot key does not send one keycode. Its firmware
# sends the Microsoft chord LeftShift + LeftMeta + F23 simultaneously, and
# holds LeftShift+LeftMeta for as long as the key is down. That is why the
# key behaves like Shift+Super in sway: Copilot+a hit $mod+Shift+$left
# (move left) instead of $mod+$left, and Copilot+Return matched nothing.
#
# xkb cannot fix this: the Shift in that chord is keycode 42, identical to
# the real left Shift key, so any keymap edit that strips it would break
# Shift itself. keyd sits below xkb and rewrites the events first.
#
# Scoped by vendor:product so the laptop's built-in keyboard is untouched.

[ids]
17ef:6116

[main]

# Collapse the Copilot chord into a plain Super.
leftshift+leftmeta+f23 = leftmeta

# Right shift acts as Alt, matching nandan:rshift_alt on the laptop.
# Done here rather than in xkb because the xkb option stopped taking effect
# once keyd started re-emitting through its virtual device. Emitting leftalt
# directly makes this independent of the keymap. Must be leftalt, not
# rightalt -- compose:ralt makes right Alt the Compose key.
rightshift = leftalt
